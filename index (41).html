<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="theme-color" content="#0f1a22">
<title>Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ====== IMPOSTAZIONI ====== */
:root{
  --ink:#F4F7F6; --muted:rgba(244,247,246,.68); --faint:rgba(244,247,246,.38);
  --glass:rgba(12,22,30,.46); --glass-strong:rgba(12,22,30,.66); --line:rgba(255,255,255,.14);
  --lemon:#F2C14E; --red:#FF8F7A; --sea:#8CC9D1;
  --sky-a:#3D6E9E; --sky-b:#C9A87C;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:#0f1a22;color:var(--ink);overflow:hidden;
  font-family:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}

/* Sfondo: cielo che cambia con ora e meteo, foto sopra */
.sky{position:fixed;inset:0;background:linear-gradient(160deg,var(--sky-a),var(--sky-b));transition:background 4s ease;z-index:0}
.bg{position:fixed;inset:0;z-index:1}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s ease;transform:scale(1.04)}
.bg img.on{opacity:1;animation:drift 70s linear forwards}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12)}}
.scrim{position:fixed;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.08) 38%,rgba(0,0,0,.18) 55%,rgba(0,0,0,.6) 100%)}

.wrap{position:relative;z-index:3;height:100%;display:grid;gap:14px;padding:22px 24px;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:auto auto minmax(0,1fr);
  grid-template-areas:"clock clock now" "days days days" "cal list film"}

.card{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid var(--line);border-radius:24px;padding:16px 18px;min-height:0;display:flex;flex-direction:column}
.card h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:19px;margin:0;letter-spacing:-.01em}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:36px}

/* Orologio */
.clock{grid-area:clock;align-self:end;padding:0 4px 4px;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.time{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:300;font-size:clamp(96px,15vw,176px);line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.date{font-size:24px;margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.date .hol{color:var(--lemon);font-weight:700}
.icon-btn{border:0;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);width:40px;height:40px;border-radius:12px;font-size:18px;display:inline-grid;place-items:center}

/* Meteo adesso */
.now{grid-area:now}
.now .main{display:flex;align-items:center;gap:14px}
.now .emo{font-size:62px;line-height:1}
.now .temp{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:300;font-size:64px;line-height:1;letter-spacing:-.04em}
.now .cond{font-size:18px}
.now .sub{color:var(--muted);font-size:15px}
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
.hours .h{color:var(--muted);font-size:13px}
.hours .e{font-size:22px;line-height:1.3}
.hours .t{font-weight:700;font-size:16px}
.hours .p{color:var(--sea);font-size:12px;min-height:1.2em}
.stale{color:var(--faint);font-size:13px;margin-top:8px}

/* Prossimi giorni */
.days{grid-area:days;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 14px}
.day{display:flex;align-items:center;gap:10px;justify-content:center}
.day .e{font-size:30px}
.day .n{font-weight:700;text-transform:capitalize}
.day .r{font-variant-numeric:tabular-nums}
.day .r .lo{color:var(--muted)}
.day .p{color:var(--sea);font-size:13px}

/* Calendario */
.cal{grid-area:cal}
.month{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:19px;text-transform:capitalize}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-weight:400;color:var(--faint);font-size:13px;padding-bottom:2px}
.cal td{text-align:center;font-variant-numeric:tabular-nums;font-size:15px;height:1.85em}
.cal td.out{color:transparent}
.cal td.sun,.cal td.hol{color:var(--red)}
.cal td.hol{font-weight:700}
.cal td.today span{display:inline-grid;place-items:center;width:1.85em;height:1.85em;border-radius:50%;background:var(--lemon);color:#14202A;font-weight:700}
.nav{display:flex;gap:6px}
.nav button{border:0;background:rgba(255,255,255,.1);width:34px;height:34px;border-radius:10px;font-size:17px}
.holnext{font-size:14px;color:var(--muted);margin-top:auto;padding-top:6px}

/* Spesa */
.list{grid-area:list}
.add{display:flex;gap:6px;margin-bottom:6px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;-webkit-user-select:text;user-select:text}
.add input::placeholder{color:var(--faint)}
.add input:focus{outline:none;border-color:var(--sea)}
.add button{border:0;background:var(--ink);color:#14202A;border-radius:12px;padding:0 14px;font-weight:700;font-size:22px;line-height:1}
.items{list-style:none;margin:0;padding:0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.items li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--sea);background:none;padding:0;color:transparent;font-weight:700;font-size:15px}
.items li.done .check{background:var(--sea);color:#14202A}
.items li.done .txt{color:var(--faint);text-decoration:line-through}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.del{border:0;background:none;color:var(--faint);font-size:22px;width:32px;height:32px}
.link{border:0;background:none;color:var(--sea);font-weight:700;padding:4px 0;font-size:15px}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

/* Film */
.film{grid-area:film}
.moods{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.mood{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:14px}
.mood[aria-pressed="true"]{background:var(--ink);color:#14202A;border-color:var(--ink)}
.picks{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.07)}
.pick .info{flex:1;min-width:0}
.pick b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:17px;display:block}
.pick .meta{color:var(--muted);font-size:13px}
.pick .seen{border:0;background:rgba(255,255,255,.1);border-radius:10px;padding:6px 9px;font-size:13px;color:var(--muted)}
.btn{border:0;background:var(--lemon);color:#14202A;border-radius:12px;padding:8px 14px;font-weight:700}

/* Menu foto */
.sheet{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.45)}
.sheet.open{display:grid}
.sheet .box{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:24px;padding:22px;width:min(420px,90vw);display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0 0 4px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:22px}
.sheet p{margin:0 0 6px;color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:rgba(255,255,255,.12)}
.sheet button.primary{background:var(--ink);color:#14202A}

/* Notte */
.night{position:fixed;inset:0;z-index:40;background:#000;display:none;place-items:center;cursor:pointer}
.night .t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:300;font-size:clamp(90px,16vw,190px);color:#6b4f1a;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.night .w{color:#3d3220;text-align:center;font-size:22px}
body.is-night .night{display:grid}

@media (max-width:900px) and (orientation:portrait){
  body{overflow:auto}
  .wrap{height:auto;grid-template-columns:1fr 1fr;grid-template-rows:none;
    grid-template-areas:"clock clock" "now now" "days days" "list film" "cal cal"}
  .days{grid-template-columns:repeat(5,1fr)}
  .day{flex-direction:column;gap:2px}
}
@media (max-width:600px){
  .wrap{grid-template-columns:1fr;grid-template-areas:"clock" "now" "days" "list" "film" "cal"}
  .days{grid-template-columns:repeat(5,1fr);font-size:14px}
}
@media (prefers-reduced-motion:reduce){.bg img.on{animation:none}.bg img,.sky{transition:none}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="bg" id="bg"></div>
<div class="scrim"></div>

<main class="wrap">
  <section class="clock" aria-label="Ora e data">
    <div class="time" id="time">--:--</div>
    <div class="date"><span id="date"></span><button class="icon-btn" id="photoBtn" aria-label="Gestisci foto">🖼️</button></div>
  </section>

  <section class="card now" aria-label="Meteo adesso">
    <div class="main"><div class="emo" id="nEmo">·</div><div><div class="temp" id="nTemp">--°</div><div class="cond" id="nCond">Carico il meteo…</div></div></div>
    <div class="sub" id="nSub"></div>
    <div class="hours" id="hours"></div>
    <div class="stale" id="stale" hidden></div>
  </section>

  <section class="card days" id="days" aria-label="Prossimi giorni"></section>

  <section class="card cal" aria-label="Calendario">
    <div class="head"><span class="month" id="monthName"></span><div class="nav"><button id="prevM" aria-label="Mese precedente">‹</button><button id="nextM" aria-label="Mese successivo">›</button></div></div>
    <table><thead><tr><th>L</th><th>M</th><th>M</th><th>G</th><th>V</th><th>S</th><th>D</th></tr></thead><tbody id="calBody"></tbody></table>
    <div class="holnext" id="holNext"></div>
  </section>

  <section class="card list" aria-label="Spesa e cose da fare">
    <div class="head"><h2>Spesa e da fare</h2><button class="link" id="clearDone" hidden>Togli spuntate</button></div>
    <form class="add" id="addForm" autocomplete="off"><input id="addIn" placeholder="Cosa manca?" aria-label="Nuova voce" enterkeyhint="done"><button type="submit" aria-label="Aggiungi">+</button></form>
    <ul class="items" id="items"></ul>
  </section>

  <section class="card film" aria-label="Film per stasera">
    <div class="head"><h2>Film per stasera</h2><button class="btn" id="suggest">Altri 3</button></div>
    <div class="moods" id="moods"></div>
    <div class="picks" id="picks"></div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="box">
    <h3 id="sheetT">Foto di sfondo</h3>
    <p id="sheetInfo">Restano salvate solo su questo dispositivo.</p>
    <div class="row">
      <button class="primary" id="addPhoto">Aggiungi foto</button>
      <button id="delPhoto">Togli quella attuale</button>
      <button id="closeSheet">Chiudi</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<div class="night" id="night" role="button" aria-label="Tocca per riaccendere"><div><div class="t" id="nightTime"></div><div class="w" id="nightW"></div></div></div>

<script>
(function(){
/* ====== IMPOSTAZIONI ====== */
const CITY = {name:"Catania", lat:37.5079, lon:15.0830};
const NIGHT_FROM = 23, NIGHT_TO = 7;   // schermo nero
const PHOTO_EVERY = 60;                // secondi tra una foto e l'altra
/* ========================== */

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const DAYS=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const DSHORT=["dom","lun","mar","mer","gio","ven","sab"];
const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Festività ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const hc={};
function hols(y){if(hc[y])return hc[y];const m={},a=(mo,d,n)=>m[mo+"-"+d]=n;
  a(0,1,"Capodanno");a(0,6,"Epifania");a(3,25,"Liberazione");a(4,1,"Festa dei lavoratori");a(5,2,"Festa della Repubblica");
  a(7,15,"Ferragosto");a(10,1,"Ognissanti");a(11,8,"Immacolata");a(11,25,"Natale");a(11,26,"Santo Stefano");
  if(y>=2026)a(9,4,"San Francesco");
  const e=easter(y);a(e.getMonth(),e.getDate(),"Pasqua");const p=new Date(e);p.setDate(p.getDate()+1);a(p.getMonth(),p.getDate(),"Pasquetta");
  return hc[y]=m}
const holOf=d=>hols(d.getFullYear())[d.getMonth()+"-"+d.getDate()];

/* ---------- Orologio + notte ---------- */
let wokeUntil=0, lastDay=-1;
function tick(){
  const n=new Date(), hm=pad(n.getHours())+":"+pad(n.getMinutes());
  if($("time").textContent!==hm){$("time").textContent=hm;$("nightTime").textContent=hm;}
  if(n.getDate()!==lastDay){
    lastDay=n.getDate(); const h=holOf(n), el=$("date");
    el.textContent=DAYS[n.getDay()]+" "+n.getDate()+" "+MONTHS[n.getMonth()];
    if(h){const s=document.createElement("span");s.className="hol";s.textContent="  "+h;el.appendChild(s);}
    viewY=n.getFullYear();viewM=n.getMonth();renderCal();
  }
  const hr=n.getHours();
  document.body.classList.toggle("is-night",(hr>=NIGHT_FROM||hr<NIGHT_TO)&&Date.now()>wokeUntil);
}
$("night").addEventListener("click",()=>{wokeUntil=Date.now()+3*60*1000;tick();});
async function wake(){try{if("wakeLock" in navigator)await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){wake();loadWeather();}});

/* ---------- Calendario ---------- */
let viewY=new Date().getFullYear(), viewM=new Date().getMonth();
function renderCal(){
  const t=new Date(), first=new Date(viewY,viewM,1), start=new Date(first);
  start.setDate(1-((first.getDay()+6)%7));
  $("monthName").textContent=MONTHS[viewM]+" "+viewY;
  const weeks=Math.ceil((((first.getDay()+6)%7)+new Date(viewY,viewM+1,0).getDate())/7);
  let html="";
  for(let w=0;w<weeks;w++){html+="<tr>";for(let d=0;d<7;d++){
    const c=new Date(start);c.setDate(start.getDate()+w*7+d);const cls=[];
    if(c.getMonth()!==viewM)cls.push("out");else{if(d===6)cls.push("sun");if(holOf(c))cls.push("hol");if(c.toDateString()===t.toDateString())cls.push("today");}
    html+='<td class="'+cls.join(" ")+'"><span>'+c.getDate()+"</span></td>";}html+="</tr>";}
  $("calBody").innerHTML=html;
  const d=new Date(t);d.setHours(0,0,0,0);
  for(let i=1;i<370;i++){d.setDate(d.getDate()+1);const h=holOf(d);if(h){$("holNext").textContent=h+" tra "+i+(i===1?" giorno":" giorni");break;}}
}
$("prevM").onclick=()=>{if(--viewM<0){viewM=11;viewY--}renderCal()};
$("nextM").onclick=()=>{if(++viewM>11){viewM=0;viewY++}renderCal()};

/* ---------- Meteo (Open-Meteo, senza chiave) ---------- */
function wx(code,day){
  const D=day!==0;
  if(code===0)return[D?"☀️":"🌙","Sereno","clear"];
  if(code===1)return[D?"🌤️":"🌙","Poco nuvoloso","clear"];
  if(code===2)return["⛅","Parzialmente nuvoloso","cloud"];
  if(code===3)return["☁️","Coperto","cloud"];
  if(code===45||code===48)return["🌫️","Nebbia","cloud"];
  if(code>=51&&code<=57)return["🌦️","Pioviggine","rain"];
  if(code>=61&&code<=67)return["🌧️",code===65?"Pioggia forte":"Pioggia","rain"];
  if(code>=71&&code<=77)return["🌨️","Neve","rain"];
  if(code>=80&&code<=82)return["🌦️","Rovesci","rain"];
  if(code===85||code===86)return["🌨️","Rovesci di neve","rain"];
  if(code>=95)return["⛈️","Temporale","storm"];
  return["·","—","cloud"];
}
const SKIES={clear:["#3D7AB8","#E7B98A"],cloud:["#56677A","#A7AEB3"],rain:["#2F4458","#6F7E8A"],storm:["#232A3A","#5A5470"],night:["#0E1A2E","#2C3550"],dusk:["#3B3A6B","#E09A6B"]};
function setSky(kind,isDay,h){
  let k=isDay?kind:"night";
  if(isDay&&kind==="clear"&&(h<8||h>=17))k="dusk";
  const s=SKIES[k]||SKIES.cloud, r=document.documentElement.style;
  r.setProperty("--sky-a",s[0]);r.setProperty("--sky-b",s[1]);
}
function renderWeather(data,fetchedAt){
  const c=data.current, now=new Date();
  const [emo,cond,kind]=wx(c.weather_code,c.is_day);
  $("nEmo").textContent=emo; $("nTemp").textContent=Math.round(c.temperature_2m)+"°"; $("nCond").textContent=cond+" a "+CITY.name;
  const dl=data.daily;
  $("nSub").textContent="Max "+Math.round(dl.temperature_2m_max[0])+"°  min "+Math.round(dl.temperature_2m_min[0])+"°   percepita "+Math.round(c.apparent_temperature)+"°   vento "+Math.round(c.wind_speed_10m)+" km/h";
  $("nightW").textContent=emo+" "+Math.round(c.temperature_2m)+"°";
  setSky(kind,c.is_day,now.getHours());
  // ore
  const H=data.hourly, curKey=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+"T"+pad(now.getHours());
  let i=H.time.findIndex(t=>t.startsWith(curKey)); if(i<0)i=0;
  let hh="";
  for(let k=1;k<=6;k++){const j=i+k*2;if(j>=H.time.length)break;
    const hr=+H.time[j].slice(11,13), isDay=hr>=7&&hr<19, p=H.precipitation_probability[j];
    hh+='<div><div class="h">'+pad(hr)+'</div><div class="e">'+wx(H.weather_code[j],isDay?1:0)[0]+'</div><div class="t">'+Math.round(H.temperature_2m[j])+'°</div><div class="p">'+(p>=20?p+"%":"")+"</div></div>";}
  $("hours").innerHTML=hh;
  // giorni
  let dd="";
  for(let k=1;k<=5&&k<dl.time.length;k++){
    const d=new Date(dl.time[k]+"T12:00"), p=dl.precipitation_probability_max[k];
    dd+='<div class="day"><span class="e">'+wx(dl.weather_code[k],1)[0]+'</span><span><span class="n">'+(k===1?"domani":DSHORT[d.getDay()]+" "+d.getDate())+'</span><br><span class="r">'+Math.round(dl.temperature_2m_max[k])+'° <span class="lo">'+Math.round(dl.temperature_2m_min[k])+'°</span></span>'+(p>=30?' <span class="p">'+p+"%</span>":"")+"</span></div>";}
  $("days").innerHTML=dd;
  const age=(Date.now()-fetchedAt)/60000;
  $("stale").hidden=age<45; if(age>=45)$("stale").textContent="Aggiornato alle "+new Date(fetchedAt).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+", connessione assente";
}
async function loadWeather(){
  const url="https://api.open-meteo.com/v1/forecast?latitude="+CITY.lat+"&longitude="+CITY.lon+
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day"+
    "&hourly=temperature_2m,weather_code,precipitation_probability"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
    "&timezone=Europe%2FRome&forecast_days=7";
  try{
    const r=await fetch(url,{cache:"no-store"}); if(!r.ok)throw new Error(r.status);
    const data=await r.json(); const at=Date.now(); store.set("wx",{data,at}); renderWeather(data,at);
  }catch(e){
    const c=store.get("wx",null);
    if(c)renderWeather(c.data,c.at); else $("nCond").textContent="Meteo non raggiungibile, riprovo tra poco";
  }
}

/* ---------- Spesa (salvata sul dispositivo) ---------- */
let items=store.get("spesa",[]);
function saveItems(){store.set("spesa",items);renderItems();}
function renderItems(){
  const ul=$("items");ul.innerHTML="";
  if(!items.length){const li=document.createElement("li");li.className="empty";li.textContent="Lista vuota.";ul.appendChild(li);}
  const sorted=items.slice().sort((a,b)=>(a.done-b.done)||(a.at-b.at));
  for(const it of sorted){
    const li=document.createElement("li");if(it.done)li.classList.add("done");
    const cb=document.createElement("button");cb.className="check";cb.textContent="✓";cb.setAttribute("aria-label",(it.done?"Togli spunta a ":"Spunta ")+it.text);
    cb.onclick=()=>{it.done=!it.done;saveItems()};
    const tx=document.createElement("span");tx.className="txt";tx.textContent=it.text;
    const del=document.createElement("button");del.className="del";del.textContent="×";del.setAttribute("aria-label","Elimina "+it.text);
    del.onclick=()=>{items=items.filter(x=>x!==it);saveItems()};
    li.append(cb,tx,del);ul.appendChild(li);
  }
  $("clearDone").hidden=!items.some(x=>x.done);
}
$("addForm").addEventListener("submit",e=>{e.preventDefault();const v=$("addIn").value.trim();if(!v)return;
  items.push({text:v.slice(0,120),done:false,at:Date.now()});$("addIn").value="";$("addIn").blur();saveItems();});
$("clearDone").onclick=()=>{items=items.filter(x=>!x.done);saveItems()};

const MOODS=[["L","Leggero"],["R","Da ridere"],["A","Romantico"],["T","Thriller"],["V","Avventura"],["C","Commovente"],["D","D’autore"],["I","Italiano"]];
const GEN={L:"leggero",R:"commedia",A:"romantico",T:"thriller",V:"avventura",C:"commovente",D:"d’autore",I:"italiano"};
let chosen=new Set(store.get("moods",[])), seen=new Set(store.get("visti",[]));
MOODS.forEach(([k,lab])=>{const b=document.createElement("button");b.className="mood";b.textContent=lab;b.setAttribute("aria-pressed",chosen.has(k));
  b.onclick=()=>{chosen.has(k)?chosen.delete(k):chosen.add(k);b.setAttribute("aria-pressed",chosen.has(k));store.set("moods",[...chosen]);suggest();};$("moods").appendChild(b);});
function suggest(){
  const late=new Date().getHours()>=22||new Date().getHours()<5;
  let pool=FILMS.filter(f=>!seen.has(f[0])&&(!chosen.size||[...chosen].some(k=>f[3].includes(k))));
  if(late){const short=pool.filter(f=>f[2]<=110);if(short.length>=3)pool=short;}
  pool=pool.slice().sort(()=>Math.random()-.5).slice(0,3);
  const el=$("picks");el.innerHTML="";
  if(!pool.length){const p=document.createElement("div");p.className="empty";p.textContent="Li avete visti tutti per questo umore. Cambia filtro.";el.appendChild(p);return;}
  for(const f of pool){
    const d=document.createElement("div");d.className="pick";
    const info=document.createElement("div");info.className="info";
    const b=document.createElement("b");b.textContent=f[0];
    const m=document.createElement("div");m.className="meta";m.textContent=f[1]+", "+f[2]+" min, "+f[3].split("").map(k=>GEN[k]).filter(x=>x!=="italiano").slice(0,2).join(", ");
    info.append(b,m);
    const s=document.createElement("button");s.className="seen";s.textContent="Visto";s.setAttribute("aria-label","Segna come già visto "+f[0]);
    s.onclick=()=>{seen.add(f[0]);store.set("visti",[...seen]);suggest();};
    d.append(info,s);el.appendChild(d);
  }
}
$("suggest").onclick=suggest;

/* ---------- Foto (IndexedDB sul dispositivo) ---------- */
let idb=null, photos=[], pIdx=0, pTimer=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("casa",1);r.onupgradeneeded=()=>r.result.createObjectStore("foto",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(mode){return idb.transaction("foto",mode).objectStore("foto");}
function loadPhotos(){return new Promise(res=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([]);});}
async function refreshPhotos(){
  photos.forEach(p=>p.url&&URL.revokeObjectURL(p.url));
  photos=(await loadPhotos()).map(p=>({id:p.id,url:URL.createObjectURL(p.blob)}));
  const bg=$("bg");bg.innerHTML="";
  if(pIdx>=photos.length)pIdx=0;
  photos.forEach((p,i)=>{const im=document.createElement("img");im.alt="";im.src=p.url;if(i===pIdx)im.className="on";bg.appendChild(im);});
  clearInterval(pTimer);if(photos.length>1)pTimer=setInterval(nextPhoto,PHOTO_EVERY*1000);
  $("sheetInfo").textContent=photos.length?photos.length+(photos.length===1?" foto":" foto")+" salvate su questo dispositivo.":"Nessuna foto: lo sfondo segue il cielo e il meteo.";
  $("delPhoto").hidden=!photos.length;
}
function nextPhoto(){const imgs=$("bg").querySelectorAll("img");if(imgs.length<2)return;imgs[pIdx].classList.remove("on");pIdx=(pIdx+1)%imgs.length;
  void imgs[pIdx].offsetWidth;imgs[pIdx].classList.add("on");}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const max=2400,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(),"image/jpeg",.86);};img.onerror=rej;img.src=url;});}
$("photoBtn").onclick=()=>$("sheet").classList.add("open");
$("closeSheet").onclick=()=>$("sheet").classList.remove("open");
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")});
$("addPhoto").onclick=()=>$("fileIn").click();
$("fileIn").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";if(!idb)return;
  $("sheetInfo").textContent="Salvo "+files.length+" foto…";
  for(const f of files){try{const blob=await shrink(f);await new Promise((res,rej)=>{const r=tx("readwrite").add({blob,at:Date.now()});r.onsuccess=res;r.onerror=rej;});}catch(err){}}
  await refreshPhotos();
};
$("delPhoto").onclick=async()=>{const p=photos[pIdx];if(!p||!idb)return;await new Promise(res=>{const r=tx("readwrite").delete(p.id);r.onsuccess=res;r.onerror=res;});await refreshPhotos();};
